#!/usr/sbin/nft -f
# Pare-feu du CT de Phare. Phare n'a pas de mot de passe : seuls le réseau local et le VPN
# atteignent le port 80. installer.sh remplace @RESEAUX_WEB@ et @RESEAUX_SSH@ par les valeurs
# de /etc/phare/agent.conf.
flush ruleset
table inet filtre {
	chain entree {
		type filter hook input priority 0; policy drop;
		ct state established,related accept
		iif lo accept
		ip protocol icmp accept
		tcp dport 80 ip saddr { @RESEAUX_WEB@ } accept
		tcp dport 22 ip saddr { @RESEAUX_SSH@ } accept
	}
}
